kind = "web"
previewPath = "/"
title = "Surrey Waste"
version = "1.0.0"
id = "artifacts/surrey-waste"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21527

[services.development]
run = "pnpm --filter @workspace/surrey-waste run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/surrey-waste", "run", "build" ]
publicDir = "artifacts/surrey-waste/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21527"
BASE_PATH = "/"
